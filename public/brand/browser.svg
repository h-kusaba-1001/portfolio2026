<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="ブラウザ">
    <title>ブラウザ</title>
    <!--
        特定の製品を指さない汎用のブラウザ記号。
        SVG を <image> として読み込むため CSS の色は継承されない。
        ライト・ダークどちらの背景でも見えるよう、中間色（slate-500）で描く。
    -->
    <g fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="8" width="38" height="32" rx="4" />
        <line x1="5" y1="18" x2="43" y2="18" />
    </g>
    <g fill="#94a3b8">
        <circle cx="11" cy="13" r="1.8" />
        <circle cx="17" cy="13" r="1.8" />
        <circle cx="23" cy="13" r="1.8" />
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round">
        <line x1="12" y1="26" x2="30" y2="26" />
        <line x1="12" y1="32" x2="24" y2="32" />
    </g>
</svg>
